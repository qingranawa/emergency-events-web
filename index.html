<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="紧急事件娱乐模式 - SCP: Secret Laboratory 事件列表">
    <meta name="author" content="清然">
    <title>紧急事件</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="MainCSS.css">
    <link rel="stylesheet" href="search-trigger.css">
    <link rel="stylesheet" href="scroll-to-to.css">
    <link rel="stylesheet" href="copy-btn.css">
    <link rel="stylesheet" href="theme-toggle.css">
    <link rel="stylesheet" href="changelog-container.css">
    <link rel="stylesheet" href="poem.css">
    <link rel="stylesheet" href="footer-container.css">
    <link rel="stylesheet" href="toc-links.css">
    <link rel="stylesheet" href="motion.css">
    <link rel="stylesheet" href="content.css">
</head>

<body>
    <button id="scroll-to-top" aria-label="返回顶部" title="返回顶部" class="scroll-top-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6" />
        </svg>
        <span class="progress-circle"></span>
        <span class="progress-text"></span>
    </button>

    <button id="search-trigger" class="search-trigger" aria-label="打开搜索">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="shortcut-hint">Ctrl+K</span>
    </button>

    <div id="search-modal" class="search-modal">
        <div class="search-modal-content">
            <div class="search-header">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-box" placeholder="搜索广播内容..." autocomplete="off" aria-label="搜索输入框">
                <button id="close-search" class="close-search" aria-label="关闭搜索">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="search-results" class="search-results">
                <div class="search-empty-state">
                    <p>输入关键词搜索广播内容</p>
                </div>
            </div>
        </div>
    </div>

    <nav class="toc-compact" aria-label="页面导航">
        <div class="toc-shell">
            <a class="toc-brand" href="#hero" aria-label="返回页面顶部">
                <span class="toc-brand-mark" aria-hidden="true">✦</span>
                <span class="toc-brand-copy"><span class="toc-brand-text"></span><span class="toc-brand-sub"></span></span>
            </a>
            <ul class="toc-links" aria-live="polite"></ul>
            <button class="toc-menu-toggle" type="button" aria-label="打开导航菜单" aria-controls="toc-mobile-menu" aria-expanded="false"><span></span><span></span></button>
        </div>
    </nav>

    <div id="toc-mobile-menu" class="toc-mobile-menu" aria-hidden="true">
        <button class="toc-menu-close" type="button" aria-label="关闭导航菜单">×</button>
        <p class="toc-mobile-eyebrow"></p>
        <div class="toc-mobile-links" aria-live="polite"></div>
    </div>

    <div class="hero" id="hero">
        <div class="hero-copy">
            <h1 class="main-title"></h1>
            <p class="hero-subtitle"></p>
        </div>
        <div class="hero-emblem" aria-hidden="true"><img src="scp-foundation-emblem.svg" alt=""></div>
    </div>

    <main id="content-root" aria-live="polite">
        <div id="content-loading" class="content-state" role="status"><span class="content-spinner" aria-hidden="true"></span>正在从 D1 加载事件资料…</div>
    </main>

    <div class="theme-toggle-holder">
        <button id="theme-toggle" aria-label="切换主题" title="切换明暗主题">
            <span class="theme-icon" aria-hidden="true">🌓</span>
            <span class="theme-text">切换主题</span>
        </button>
    </div>

    <footer id="site-footer"></footer>

    <script src="search-trigger.js"></script>
    <script src="scroll-to-to.js"></script>
    <script src="copy-btn.js"></script>
    <script src="theme-toggle.js"></script>
    <script src="reveal.js"></script>
    <script src="toc-links.js"></script>
    <script src="motion.js"></script>
    <script src="content.js"></script>
</body>

</html>
